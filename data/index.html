<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZumoWifi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>ZumoWifi</h1>
        <span id="status-badge" class="badge offline">Disconnected</span>
    </header>

    <nav>
        <button class="tab active" data-tab="files">Files</button>
        <button class="tab" data-tab="wifi">WiFi</button>
        <button class="tab" data-tab="info">Info</button>
    </nav>

    <!-- Files Tab -->
    <section id="tab-files" class="tab-content active">
        <div class="toolbar">
            <span id="current-path">/</span>
            <button id="btn-up" title="Parent directory">&uarr; Up</button>
            <button id="btn-refresh" title="Refresh">Refresh</button>
            <button id="btn-mkdir" title="New folder">+ Folder</button>
            <label class="btn-upload" title="Upload file">
                Upload
                <input type="file" id="file-upload" multiple hidden>
            </label>
        </div>
        <div id="file-list" class="file-list">
            <p class="placeholder">Connect a Garmin device via USB to browse files.</p>
        </div>
        <div id="upload-progress" class="progress-bar" hidden>
            <div id="progress-fill"></div>
            <span id="progress-text">0%</span>
        </div>
    </section>

    <!-- WiFi Tab -->
    <section id="tab-wifi" class="tab-content">
        <h2>WiFi Settings</h2>
        <div class="card">
            <h3>Current Connection</h3>
            <p>Mode: <strong id="wifi-mode">AP</strong></p>
            <p>SSID: <strong id="wifi-ssid">ZumoWifi</strong></p>
            <p>IP: <strong id="wifi-ip">192.168.4.1</strong></p>
        </div>
        <div class="card">
            <h3>Connect to Network</h3>
            <button id="btn-scan">Scan Networks</button>
            <div id="network-list"></div>
            <form id="wifi-form">
                <input type="text" id="wifi-ssid-input" placeholder="SSID" required>
                <input type="password" id="wifi-pass-input" placeholder="Password">
                <button type="submit">Connect</button>
            </form>
        </div>
    </section>

    <!-- Info Tab -->
    <section id="tab-info" class="tab-content">
        <h2>Device Info</h2>
        <div class="card">
            <p>Device: <strong id="info-device">–</strong></p>
            <p>Free Heap: <strong id="info-heap">–</strong></p>
            <p>Uptime: <strong id="info-uptime">–</strong></p>
        </div>
    </section>

    <script src="app.js"></script>
</body>
</html>
