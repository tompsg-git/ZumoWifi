; ZumoWifi – ESP32-S2 USB-Stick WiFi File Server
; Flashen via USB, danach USB-Port im Host-Mode für USB-Stick frei.

[env:esp32s2]
platform = espressif32
board = esp32-s2-saola-1
framework = arduino

; USB OTG: kein CDC beim Booten → Port bleibt nach Flash für USB-Stick frei
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=3

; USB MSC Host Komponente: in components/ ablegen (siehe README)
; git clone --depth=1 https://github.com/espressif/idf-extra-components /tmp/idf-extra
; cp -r /tmp/idf-extra/usb/usb_host_msc components/
board_build.cmake_extra_args =
    -DEXTRA_COMPONENT_DIRS=${PROJECT_DIR}/components

lib_deps =
    ESP Async WebServer @ ^3.0.0
    AsyncTCP @ ^3.0.0
    ArduinoJson@^7

lib_ignore =
    AsyncTCP_RP2040W

board_build.filesystem = littlefs
board_build.partitions = default.csv

monitor_speed = 115200
upload_speed = 921600
