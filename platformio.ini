; PlatformIO Configuration for ZumoWifi
; ESP32-S3 WiFi Gateway for Garmin Zumo

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; USB OTG support
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3

; Libraries
lib_deps =
    ESP Async WebServer
    ArduinoJson@^7
    AsyncTCP

; File system for web interface
board_build.filesystem = littlefs
board_build.partitions = default_16MB.csv

; Upload & monitor
monitor_speed = 115200
upload_speed = 921600
