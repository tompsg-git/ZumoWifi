; ZumoWifi – ESP32-S2 USB-Stick WiFi File Server
; Flashen via USB, danach USB-Port im Host-Mode für USB-Stick frei.

[env:esp32s2]
platform = espressif32
board = esp32-s2-saola-1
framework = arduino

; USB OTG: kein CDC beim Booten → Port bleibt nach Flash für USB-Stick frei
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_FATFS_LFN_HEAP=1

; Für USB Host MSC wird der IDF-Komponenten-Manager benötigt (siehe idf_component.yml)
board_build.cmake_extra_args =
    -DIDF_COMPONENT_MANAGER=1

lib_deps =
    ESP Async WebServer
    ArduinoJson@^7
    AsyncTCP

; LittleFS für Web-Interface, eigene Partitionstabelle für USB-Puffer
board_build.filesystem = littlefs
board_build.partitions = default.csv

; Debug-Serial via UART0 (GPIO 1 TX / GPIO 3 RX), NICHT via USB CDC
monitor_speed = 115200
upload_speed = 921600
